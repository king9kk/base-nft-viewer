<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Base NFT Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0b0d; color: #fff; font-family: Arial, sans-serif; }
    .navbar { background: #1a1b1f; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
    .navbar h1 { color: #0052ff; font-size: 20px; }
    .hero { text-align: center; padding: 60px 24px; }
    .hero h2 { font-size: 32px; margin-bottom: 12px; }
    .hero p { color: #888; font-size: 16px; }
    .search-box { display: flex; gap: 12px; max-width: 500px; margin: 32px auto 0; padding: 0 24px; }
    .search-box input { flex: 1; background: #1a1b1f; border: 1px solid #2a2b2f; color: #fff; padding: 12px 16px; border-radius: 8px; font-size: 14px; }
    .search-box button { background: #0052ff; color: #fff; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-size: 14px; }
    .nft-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; max-width: 900px; margin: 40px auto; padding: 0 24px; }
    .nft-card { background: #1a1b1f; border-radius: 12px; overflow: hidden; border: 1px solid #2a2b2f; }
    .nft-img { width: 100%; height: 200px; background: #2a2b2f; display: flex; align-items: center; justify-content: center; font-size: 48px; }
    .nft-info { padding: 12px; }
    .nft-name { font-weight: bold; margin-bottom: 4px; }
    .nft-collection { color: #888; font-size: 12px; }
  </style>
</head>
<body>
  <nav class="navbar">
    <h1>🖼️ Base NFT Viewer</h1>
    <span id="nft-count"></span>
  </nav>
  <div class="hero">
    <h2>View Your NFTs on Base</h2>
    <p>Enter a wallet address to see all NFTs on Base network</p>
    <div class="search-box">
      <input type="text" id="wallet-input" placeholder="Enter wallet address 0x...">
      <button onclick="loadNFTs()">Search</button>
    </div>
  </div>
  <div class="nft-grid" id="nft-grid"></div>
</body>
</html>
